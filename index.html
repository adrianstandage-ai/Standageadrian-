circle.sm{transform-box:fill-box;transform-origin:center;animation:smoke 3.2s ease-out infinite}@keyframes smoke{0%{opacity:.55;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(8px,-24px) scale(1.7)}}
.coin{animation:fall 1.3s cubic-bezier(.4,.1,.6,1) forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.track{animation:streetmove 36s linear infinite}@keyframes streetmove{to{transform:translateX(-300px)}}
.road:after{animation:roadmove 4s linear infinite}@keyframes roadmove{to{background-position:-34px 0}}
.veh.car{animation:cross 14s linear -3s infinite}.veh.bike{animation:cross 24s linear -11s infinite}.veh.van{animation:cross 31s linear -22s infinite}@keyframes cross{from{left:-70px}to{left:100%}}
.bl{animation:bob 2.4s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-3px)}}

.ci{transform-box:fill-box;transform-origin:center;animation:cp 8s ease-in-out infinite alternate}@keyframes cp{to{transform:scale(1.15)}}
.ov{animation:fade .2s}@keyframes fade{from{opacity:0}}
.chart.in .ln{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.3s .35s ease forwards}.hero:after{content:'';position:absolute;top:-50%;left:-40%;width:40%;height:200%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:rotate(8deg);animation:sheen 1.8s ease-out .5s 1 both}@keyframes sheen{to{left:130%}}.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}

<style>.pupc{margin-top:12px}.pupstage{flex:none;width:130px;height:122px;overflow:hidden;position:relative}.pupav{position:relative;width:130px;height:122px;cursor:pointer;-webkit-tap-highlight-color:transparent}.zzs{position:absolute;right:2px;top:8px;pointer-events:none}.thk{position:absolute;top:0;right:0;font-size:17px;background:var(--s2);border-radius:99px;padding:1px 7px;animation:thp 1.3s ease-in-out infinite alternate;pointer-events:none}@keyframes thp{to{transform:translateY(-3px) scale(1.06)}}.pn{background:none;border:0;color:var(--tx);font-weight:800;font-size:18px;padding:0;cursor:pointer}.hrt{font-size:18px;letter-spacing:2px;color:rgba(128,140,160,.4)}.hrt .on{color:#fb7185}.say{margin-top:8px;background:var(--s2);border-radius:14px;padding:9px 12px;font-size:13px;color:var(--tx);cursor:pointer;position:relative}.star{position:fixed;top:-24px;z-index:30;font-style:normal}.ht2{position:fixed;z-index:60;pointer-events:none;color:#fb7185;font-size:18px;font-style:normal}.bn{position:fixed;z-index:60;font-size:24px;font-style:normal;pointer-events:none;transition:transform .6s cubic-bezier(.5,0,.8,1)}.cele{width:min(90vw,350px);position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#06174a,#136a86);color:#effffa;border-radius:20px;padding:10px 16px;box-shadow:0 18px 40px -12px rgba(0,0,0,.6);max-width:92vw}.cele b{display:block;font-size:16px}.cele span{font-size:12px;opacity:.85}.wdg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wd{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:8px 4px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:11px}.wd b{font-size:12px}.wd span{color:var(--mu);font-size:10px;text-align:center}.wd.sel{border-color:var(--inc);box-shadow:0 0 0 1px var(--inc)}.wd.lock{opacity:.55;cursor:default}</style>

<body>

<script>
const CATS=["Mortgage Interest (Finance Costs)","Repairs & Maintenance","Legal & Professional Fees","Property Agent Fees","Property Insurance","Utilities & Council Tax","Ground Rent & Service Charge","Platform/Advertising Fees (Airbnb/Booking.com)","Cleaning, Laundry & Guest Supplies","Travel & Vehicle Costs","Other Allowable Property Expenses"];
const FIN=CATS[0],KEY="propertypulse_v1";
let UPDW=null,updReq=0,updDone=0,NEWER=0,WCL="",SOLID=0;
const TABS=[["dash","Dashboard","M3 12l9-8 9 8M5 10v10h14V10"],["props","Properties","M4 21V7l8-4 8 4v14M9 21v-6h6v6"],["log","Log Entry","M12 5v14M5 12h14"],["tax","Tax summary","M6 3h9l4 4v14H6zM9 12h7M9 16h7"]];
const curTY=()=>{const d=new Date(),y=d.getFullYear();return d.getMonth()>3||(d.getMonth()==3&&d.getDate()>=6)?y:y-1},RL=y=>y>=2027?.22:.2,RP=y=>Math.round(RL(y)*100),RB=y=>y>=2027?2:0;
let viewProp=null,S,tab="dash",type="inc",ty=curTY(),tipIdx=null,draft={};
const e=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gbp=(n,d=0)=>(n<0?"-":"")+"£"+Math.abs(n).toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);

function seed(){
 const props=[{id:"p1",name:"Elm Court, Flat 4",addr:"4 Elm Court, Manchester M14 5QA",kind:"PRS",ptype:"flat",price:185000,interest:420},
 {id:"p2",name:"Harbour View Cottage",addr:"9 Quay Street, Whitby YO21 3PE",kind:"STR",price:290000,interest:680},
 {id:"p3",name:"14 Northgate Road",addr:"14 Northgate Road, Leeds LS6 2JD",kind:"PRS",ptype:"house",price:210000,interest:510},{id:"p4",name:"Beech Road HMO",addr:"22 Beech Road, Sheffield S10 1AB",kind:"PRS",ptype:"hmo",price:320000,interest:760}];
 const en=[],add=(d,p,t,a,ds,c)=>en.push({id:uid(),date:d,pid:p,type:t,amt:a,desc:ds,cat:c||""});
 const str=[1850,2240,3120,3890,4210,2960];
 for(let m=0;m<6;m++){const M=String(m+4).padStart(2,"0"),d=x=>`2026-${M}-${x}`;
  add(d("06"),"p1","inc",950,"Monthly rent");add(d("06"),"p3","inc",1100,"Monthly rent");add(d("28"),"p2","inc",str[m],"Holiday bookings");
  add(d("15"),"p1","exp",420,"Mortgage interest",FIN);add(d("15"),"p2","exp",680,"Mortgage interest",FIN);add(d("15"),"p3","exp",510,"Mortgage interest",FIN);add(d("08"),"p4","inc",2080,"Room rents (4 rooms)");add(d("15"),"p4","exp",760,"Mortgage interest",FIN);
  add(d("20"),"p2","exp",Math.round(str[m]*.15),"Platform commission",CATS[7]);add(d("10"),"p1","exp",95,"Agent management fee",CATS[3]);}
 add("2026-05-12","p3","exp",340,"Boiler service & repair",CATS[1]);add("2026-05-20","p4","exp",390,"HMO licence renewal",CATS[10]);add("2026-08-12","p4","exp",240,"Fire alarm service",CATS[10]);add("2026-06-03","p2","exp",185,"Buildings & contents insurance",CATS[4]);
 add("2026-07-19","p1","exp",620,"Bathroom leak repair",CATS[1]);add("2026-08-08","p2","exp",260,"Utilities, gas & electric",CATS[5]);add("2026-09-14","p3","exp",450,"Tenancy agreement, legal check",CATS[2]);
 const ad=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};return{demo:true,props,entries:en,rules:[],rem:[{id:'r1',pid:'p1',kind:'Gas safety certificate',due:ad(18)},{id:'r2',pid:'p3',kind:'EICR',due:ad(45)},{id:'r3',pid:'p2',kind:'Insurance renewal',due:ad(-3)}]};
}
function schemaV(){return 2}
function snap(raw){try{if(raw.length<1500000)localStorage.setItem("pp_prev",raw)}catch(x){}}
function migrateUserData(d){d=d||{};d.props=Array.isArray(d.props)?d.props:[];d.entries=Array.isArray(d.entries)?d.entries:[];d.rules=d.rules||[];d.rem=d.rem||[];d.inbox=d.inbox||[];
 if((d.v||1)<2)d.props.forEach(p=>{p.ptype=p.ptype||"house";p.kind=p.kind||"PRS"});d.v=schemaV();return d}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if((d.v||1)>schemaV()){NEWER=1;snap(r);return d}if((d.v||1)<schemaV())snap(r);return migrateUserData(d)}}catch(x){}return migrateUserData(seed())}
function save(){if(NEWER){if(!save.n){save.n=1;setTimeout(()=>toast("This data is from a newer PropNet. Refresh to update. Changes are paused."),50)}return false}S.rev=(S.rev||0)+1;try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(x){if(!save.w){save.w=1;setTimeout(()=>toast('Phone storage is full. Your latest change may not be saved. Send a backup now.'),50)}return false}}
S=load();S.rules=S.rules||[];S.rem=S.rem||[];const AUTO=runRules();

const inTY=d=>d>=`${ty}-04-06`&&d<=`${ty+1}-04-05`;
const ents=()=>S.entries.filter(x=>inTY(x.date));
const sum=a=>a.reduce((t,x)=>t+x.amt,0);
function calc(f){
 const E=ents().filter(x=>!f||f=="all"||((S.props.find(q=>q.id==x.pid)||{}).kind||"PRS")==f),inc=sum(E.filter(x=>x.type=="inc")),ex=E.filter(x=>x.type=="exp"),
 fin=sum(ex.filter(x=>x.cat==FIN)),allow=sum(ex)-fin,adj=inc-allow,
 relief=Math.max(0,Math.min(fin,Math.max(adj,0)))*RL(ty);
 return{E,inc,ex,fin,allow,adj,relief,totalExp:sum(ex),net:inc-sum(ex)};
}
const pname=id=>(S.props.find(p=>p.id==id)||{name:"Deleted property"}).name;

function dash(ins){if(new Set(S.props.map(p=>p.kind||"PRS")).size<2)DF="all";
 const c=calc(DF),mo=Array.from({length:12},(_,i)=>{const m=(i+3)%12,y=ty+(m<3?1:0),k=`${y}-${String(m+1).padStart(2,"0")}`;
  const L=c.E.filter(x=>x.date.startsWith(k));return{n:"AMJJASONDJFM"[i],i:sum(L.filter(x=>x.type=="inc")),x:sum(L.filter(x=>x.type=="exp"))}});
 const mx=Math.max(1,...mo.map(m=>Math.max(m.i,m.x))),H=130;
 const bars=mo.map((m,i)=>{const x=10+i*27,hi=m.i/mx*H,hx=m.x/mx*H;
  return`<g data-i="${i}" style="cursor:pointer"><rect x="${x-2}" y="0" width="25" height="${H+22}" fill="transparent"/>
  <rect x="${x}" y="${H-hi}" width="10" height="${hi}" rx="3" fill="url(#gi)" opacity="${tipIdx==null||tipIdx==i?1:.35}"/>
  <rect x="${x+11}" y="${H-hx}" width="10" height="${hx}" rx="3" fill="url(#gx)" opacity="${tipIdx==null||tipIdx==i?1:.35}"/>
  <text x="${x+10}" y="${H+16}" text-anchor="middle" font-size="10" fill="var(--mu)">${m.n}</text></g>`}).join("");
 const t=tipIdx!=null?mo[tipIdx]:null;
 const rec=[...c.E].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,3);
 const PN=S.props.filter(p=>DF=="all"||(p.kind||"PRS")==DF).length;const CH=`<h2>Income vs expenses</h2><div class="chart"><svg viewBox="0 0 340 152" role="img" aria-label="Monthly income and expenses"><defs><linearGradient id="gi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".5"/></linearGradient><linearGradient id="gx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#fb7185" stop-opacity=".5"/></linearGradient></defs>${bars}</svg>
 <div class="legend"><span><i style="background:var(--inc)"></i>Income</span><span><i style="background:var(--exp)"></i>Expenses</span></div>
 <div id="tip">${t?`<b>${["April","May","June","July","August","September","October","November","December","January","February","March"][tipIdx]}</b>: <span class="inc">${gbp(t.i)}</span> in, <span class="exp">${gbp(t.x)}</span> out`:`<span class="lbl">Tap a month for details</span>`}</div></div>`;if(ins)return`<div class="top"><div><h1>Insights</h1><p class="sub">Tax year ${ty}/${String(ty+1).slice(2)}</p></div><div style="display:flex;gap:10px;align-items:center">${yearSel()}<button class="btn ghost sm" onclick="go('dash')">Back</button></div></div>${filt()}${taxpot(calc())}${CH}${trend(c)}${donut(c)}`;
 return`<div class="top"><div><div class="brand"><svg class="logo" viewBox="0 0 512 512"><defs><linearGradient id="lg" x1=".05" y1="0" x2=".95" y2="1"><stop offset="0" stop-color="#06174a"/><stop offset=".5" stop-color="#136a86"/><stop offset="1" stop-color="#70e8b8"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#lg)"/><path d="M70 70L442 442M442 70L70 442M70 190L322 442M190 70L442 322M70 322L190 442M322 70L442 190" stroke="#effffa" stroke-opacity=".13" stroke-width="6" fill="none"/><g transform="translate(-20 -30)"><rect x="146" y="150" width="30" height="64" rx="4" fill="#effffa"/>
<g fill="none" stroke="#effffa" stroke-width="32" stroke-linejoin="round"><path d="M100 280L250 156 348 238" stroke-linecap="round"/><path d="M176 232V424" stroke-linecap="butt"/><path d="M348 238C392 276 376 322 320 322H176" stroke-linecap="butt"/></g>
<rect x="238" y="250" width="36" height="36" fill="#effffa"/>
<path class="pl" d="M182 424L262 372 316 428 414 282" fill="none" stroke="#effffa" stroke-width="32" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M458 232L386 246 446 306Z" fill="#effffa"/></g></svg><h1>PropNet</h1></div><p class="sub">Track profit. Get SA105-ready.</p></div><div style="display:flex;gap:10px;align-items:center">${yearSel()}<button class="avb" onclick="profModal()" aria-label="Profile">${av()}</button></div></div><p class="greet">${greet()}</p>${filt()}${demoCard()}
 <div class="hero scn ${tod()}"><div class="lbl">Net operating profit</div><div class="big ${c.net<0?"exp":""}" data-net="${c.net}" data-k="${ty}|${DF}">${gbp(c.net)}</div>
 <p class="sub">${PN} propert${PN==1?"y":"ies"} · ${c.E.length} entries logged</p>${sky()}</div>${ins?"":pupCard()}
 <div class="grid"><div class="card"><div class="lbl">Gross revenue</div><div class="v inc">${gbp(c.inc)}</div></div>
 <div class="card"><div class="lbl">Total expenses</div><div class="v exp">${gbp(c.totalExp)}</div></div>
 <div class="card" style="grid-column:span 2"><div class="lbl">Estimated Section 24 tax relief (${RP(ty)}% of finance costs)</div><div class="v gold">${gbp(c.relief)}</div></div></div>
 ${inboxCard()}${confirmCard()}${remCard()}${bkCard()}<h2>Recent activity</h2><div class="card">${rec.length?rec.map(row).join(""):`<div class="empty">No entries yet. Log your first income or expense.</div>`}</div><label class="btn" style="display:block;text-align:center;margin:14px 0 0;cursor:pointer;font-size:15px;font-weight:700">Snap a receipt<input type="file" accept="image/*" capture="environment" style="display:none" onchange="snapPick(this)"></label><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px"><button class="btn ghost" onclick="go('all')">Search</button><button class="btn" onclick="go('ins')">Insights</button><button class="btn ghost" onclick="go('help')">Help</button></div>`;
}
function row(x){const i=x.type=="inc";return`<div class="row" data-eid="${x.id}" onclick="editEntry('${x.id}')" style="cursor:pointer"><div class="dot" style="background:${i?"rgba(127,207,166,.15)":"rgba(231,160,143,.15)"};color:var(--${i?"inc":"exp"})">${ic(x)}</div>
 <div class="m"><b>${e(x.desc||x.cat||"Entry")}</b><span>${e(pname(x.pid))} · ${new Date(x.date).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}${x.rc?" · Receipt":""}${x.auto?' · <b style="color:var(--acc)">Auto</b>':""}</span></div>
 <b class="${i?"inc":"exp"}">${i?"+":"-"}${gbp(x.amt,2)}</b></div>`}
function yearSel(){return`<select class="pill" onchange="ty=+this.value;tipIdx=null;enter=true;render()" aria-label="Tax year">${[curTY()-1,curTY(),curTY()+1].map(y=>`<option value="${y}" ${y==ty?"selected":""}>${y}/${String(y+1).slice(2)}</option>`).join("")}</select>`}

function props(){if(viewProp)return propDetail();
 const cards=S.props.map(p=>{const L=S.entries.filter(x=>x.pid==p.id&&inTY(x.date)),i=sum(L.filter(x=>x.type=="inc")),x=sum(L.filter(x=>x.type=="exp"));
  return`<div class="card prop" onclick="openProp('${p.id}')" style="cursor:pointer">${cover(p)}<div class="h"><div><b style="font-size:16px">${e(p.name)}</b><p class="sub">${e(p.addr)}</p></div>${badge(p)}</div>
  <div class="st"><div><div class="lbl">Income</div><b class="inc">${gbp(i)}</b></div><div><div class="lbl">Expenses</div><b class="exp">${gbp(x)}</b></div><div><div class="lbl">Bought for</div><b>${gbp(p.price)}</b></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="event.stopPropagation();openProp('${p.id}')">View history</button><button class="btn ghost sm" onclick="event.stopPropagation();postInterest('${p.id}')">Log ${gbp(p.interest)} interest</button><button class="btn ghost sm" onclick="event.stopPropagation();delProp('${p.id}')">Remove</button></div></div>`}).join("");
 return`<div class="top"><div><h1>Properties</h1><p class="sub">Your rental portfolio</p></div></div>
 <button class="btn" onclick="propModal()" style="margin-bottom:14px">Add property</button>${cards||`<div class="empty">No properties yet. Add one to start logging.</div>`}
 <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn ghost sm" onclick="if(confirm('Delete everything and start with an empty account?')){S={props:[],entries:[],rules:[],rem:[]};save();render()}">Start fresh</button><button class="btn ghost sm" onclick="if(confirm('Replace all data with the sample data?')){S=seed();save();render()}">Reset sample data</button></div><p class="note">Your data stays on this device. PropNet has no accounts and never uploads your records.</p>`;
}
function propModal(id){if(!id){if(S.demo){if(!confirm("Clear the sample data and start with your own property?"))return;clearDemo()}else if(!isProUser()&&S.props.length>=1){paywall();return}}const p=id?S.props.find(q=>q.id==id):{};pend=undefined;
 layer(`<h1 style="margin-bottom:14px">${id?"Edit":"Add"} property</h1><form onsubmit="addProp(event,'${id||""}')">
 <label>Property name or ID<input name="name" value="${e(p.name||"")}" required></label><label>Full address<input name="addr" value="${e(p.addr||"")}" required></label>
 <label>Property type<select name="ptype">${[["house","House"],["flat","Flat / apartment"],["hmo","HMO / room lets"]].map(o=>`<option value="${o[0]}" ${(p.ptype||"house")==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></label><label>How is it let?<select name="kind"><option value="PRS" ${p.kind!="STR"?"selected":""}>Long-term tenancy</option><option value="STR" ${p.kind=="STR"?"selected":""}>Holiday let (Airbnb, Booking.com)</option></select></label>
 <label>Purchase price<span class="amt"><input name="price" type="number" min="0" step="any" inputmode="decimal" value="${p.price??""}" required></span></label>
 <label>Monthly mortgage interest<span class="amt"><input name="interest" type="number" min="0" step="any" inputmode="decimal" value="${p.interest??""}" required></span></label>
 <label>Photo (optional)<input type="file" accept="image/*" onchange="pph(this)"><span id="pps" class="sub">${p.photo?"Photo added. Choose another to replace.":""}</span></label><button class="btn" type="submit">Save property</button><button class="btn ghost" type="button" style="margin-top:8px" onclick="layer('')">Cancel</button></form>`);

 ["Is PropNet Making Tax Digital software?","No. PropNet doesn't connect to HMRC and can't send quarterly updates. Since April 2026, landlords with qualifying income over £50,000 must use HMRC-recognised software for that, falling to £30,000 in April 2027 and £20,000 in April 2028. PropNet keeps your records and figures, and you can export them for your accountant or MTD software. Check HMRC's guidance on whether you need to join."],["Which tax rates does PropNet use?","England, Wales and Northern Ireland: 20%, 40% and 45% up to 2026/27, and 22%, 42% and 47% for property income from 2027/28, with Section 24 relief at 20% then 22%. Scottish taxpayers pay different rates, so treat the figures as a rough guide."],["Which SA105 box does each expense go in?","The Tax summary screen matches each category to an SA105 box. Box numbers are from the 2025/26 form and can change, so check the label on the form for the year you file."],["Does PropNet send my data anywhere?","Your records stay on your device. The only thing PropNet contacts a server for is checking a Pro licence key, and that sends the key, not your records."],["What do I get with Pro?","Unlimited properties and the SA105 summary exports (PDF and CSV), plus updates and email support. It costs £39.99 for the first year, then £29.99 a year. Backup, restore and receipts stay free."],["What happens if I do not renew?","PropNet keeps working on the free plan: 1 property, unlimited entries, backup, restore and receipts. Your data stays on your phone. Pro exports and extra properties pause until you renew."],["I lost or changed my phone. Can you recover my data?","No. Your records live only on your device, and we never receive them, so we cannot recover them. Restore from a backup file you saved earlier. Make a backup now and then and keep it in cloud storage or email it to yourself. Your Pro licence key can be activated on a new phone from the licence screen."],["Where are my receipts stored?","On this phone only, in the browser's own file storage. They are included in a backup while Include receipts is ticked, which makes the backup file bigger."],["I lost my phone. Can I get my records back?","Only from a backup file. On the new phone open the app, go to Tax summary, Export data & backup, then Restore from backup, and pick the file you sent to your email or Drive. Without a backup the records cannot be recovered, so send one regularly."],["How do I move to a new phone?","On the Tax summary screen choose Export data & backup, download a backup, then use Restore from backup on the new phone."],
